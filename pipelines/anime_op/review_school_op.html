<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 校园 OP · 逐镜验收</title>
<style>
:root{color-scheme:dark;--bg:#10141c;--panel:#1a2130;--line:#303c50;--text:#ecf1f9;--dim:#a7b7cf;--blue:#93bfff;--green:#8cdfbb;--red:#ffb4a1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}button,select,textarea{font:inherit;color:inherit}button,select{border:1px solid var(--line);background:#263349;border-radius:7px;padding:8px 13px;cursor:pointer}button:hover{border-color:var(--blue)}button:disabled{opacity:.4;cursor:default}header{padding:18px 26px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font-size:21px;margin:0}small,.muted{color:var(--dim)}.layout{display:grid;grid-template-columns:215px minmax(0,1fr)}aside{padding:18px 12px;border-right:1px solid var(--line);height:calc(100vh - 94px);position:sticky;top:0;overflow:auto}aside select{width:100%;margin-bottom:12px}.shot{width:100%;margin:3px 0;text-align:left;display:flex;justify-content:space-between;font-size:13px;background:transparent}.shot.active{background:#304769;border-color:var(--blue)}.badge{font-size:12px}.approved{color:var(--green)}.changes{color:var(--red)}main{padding:20px 26px;max-width:1600px;width:100%}.topline,.controls,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.topline{justify-content:space-between;margin-bottom:12px}h2{font-size:23px;margin:0}.players{display:grid;grid-template-columns:1fr 1fr;gap:14px}figure{margin:0;min-width:0}figcaption{margin-bottom:6px;color:var(--dim)}video{width:100%;aspect-ratio:16/9;background:#000;border-radius:8px;display:block}.controls{margin:12px 0}.controls label{display:flex;align-items:center;gap:5px}.panel{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:18px;margin-top:18px}h3{margin:0 0 10px;font-size:17px}p{margin:9px 0}.summary{display:flex;flex-wrap:wrap;gap:8px 22px;color:var(--dim)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.75 ui-monospace,Consolas,monospace;max-height:480px;overflow:auto;margin:12px 0 0;background:#0d131f;padding:16px;border-radius:6px}textarea{width:100%;min-height:100px;border:1px solid var(--line);border-radius:7px;background:#0d131f;padding:12px;resize:vertical}textarea:focus{outline:1px solid var(--blue)}summary{cursor:pointer;color:var(--blue)}.actions{margin-top:12px}.primary{background:#24684d;border-color:#4ea57f}.warning{background:#623a31;border-color:#ab6c58}#message{min-height:24px;color:var(--green);margin-top:8px}#message.error{color:var(--red)}.refs{display:flex;gap:12px;overflow:auto}.refs img{height:155px;max-width:200px;object-fit:contain;background:#fff}.refs figcaption{font-size:12px}.empty{height:160px;display:grid;place-items:center;border:1px dashed var(--line);color:var(--dim)}.hidden{display:none!important}.statusline{font-size:13px;color:var(--dim)}.draft{min-height:260px;font-family:Consolas,monospace}a{color:var(--blue)}details{margin-top:12px}.notice{font-size:13px;color:var(--dim);margin-bottom:12px}.locknote{color:var(--green)}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}#shotList{display:flex;overflow:auto}aside select{width:160px}.shot{min-width:130px;width:auto}.players{grid-template-columns:1fr}header,main{padding:16px}header{align-items:flex-start;flex-direction:column}}
</style></head><body>
<header><div><h1>AI 校园 OP · 逐镜验收</h1><small>先看当前片段和实际提示词，再确认或提出修改。</small></div><div><div id="counts">载入中…</div><small>生成已暂停 · 验收操作只保存记录</small></div></header>
<div class="layout"><aside><select id="filter" aria-label="筛选镜头"><option value="all">全部镜头</option><option value="pending">待确认</option><option value="changes">待修改</option><option value="approved">已通过</option><option value="missing">待生成</option></select><nav id="shotList" aria-label="镜头列表"></nav></aside>
<main><div class="topline"><h2 id="title">载入中</h2><div class="controls"><button id="prev">← 上一段</button><button id="next">下一段 →</button></div></div>
<div class="summary"><span id="time"></span><span id="cast"></span><span id="status"></span></div>
<div class="controls"><label>查看版本 <select id="version" aria-label="查看版本"></select></label><span class="statusline" id="versionNote"></span></div>
<div class="players"><figure><figcaption>原片 · 同一镜头</figcaption><video id="source" controls playsinline muted preload="metadata"></video></figure><figure><figcaption>当前候选 · 原音乐</figcaption><video id="output" controls playsinline preload="metadata"></video><div id="missing" class="empty hidden">此镜头尚未生成</div></figure></div>
<div class="controls"><button id="play">一起从头播放</button><button id="pause">暂停</button><button id="backFrame">− 1 帧</button><button id="forwardFrame">+ 1 帧</button><label>速度 <select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select></label><label><input id="loop" type="checkbox" checked>循环</label></div>
<section class="panel"><div class="topline"><h3>实际提示词 / 制作参数</h3><button id="copyPrompt">复制内容</button></div><p id="promptNote" class="notice"></p><pre id="prompt"></pre><details id="queuedBox" class="hidden" open><summary>今晚待运行的新提示词（尚未生成）</summary><p id="queuedInfo" class="statusline"></p><pre id="queued"></pre></details><details><summary>参考图片与任务记录</summary><div id="refs" class="refs"></div><p id="seed" class="statusline"></p><p id="workflow" class="statusline"></p></details><details><summary>原计划说明（不等于当前版本实际输入）</summary><p id="description"></p><p id="credits"></p><pre id="planned"></pre></details></section>
<section class="panel"><h3>你的验收意见</h3><p id="approvedNote" class="locknote hidden">此版本已通过。片段和提示词已保留，新修订仍需重新确认。</p><label for="note">问题或修改要求</label><textarea id="note" placeholder="例如：远景仍是短发小鞠；只改窗前桌后的女孩为铜橙长发 Claude，保留动作和构图。"></textarea><details><summary>提示词修改草案（可选）</summary><p class="notice">草案单独保存，不会覆盖上面的实际提示词。</p><button id="usePrompt">用实际提示词填入草案</button><textarea id="draft" class="draft" aria-label="提示词修改草案"></textarea></details><div class="actions"><button id="approve" class="primary">通过，确认此版本</button><button id="changes" class="warning">保存问题，待修改</button><button id="pending">保存备注，暂不决定</button><button id="copyFeedback">复制反馈给对话</button></div><div id="message" role="status" aria-live="polite"></div><p class="notice">记录会保存到项目中。需要我开始迭代时，在对话里说“处理第 009 段”等镜头编号；我会读取这里的意见。通过后自动前往下一段待确认镜头。</p></section>
</main></div>
<script>
const $=id=>document.getElementById(id);let data, shot, version, dirty=false, busy=false;
const names={pending:'待确认',approved:'已通过',changes:'待修改',missing:'待生成'};
const source=$('source'),output=$('output');
function decision(s,v){return v?data.state.decisions[s.id+'/'+v.id]||{status:'pending',note:'',prompt_draft:''}:{status:'missing',note:'',prompt_draft:''}}
function last(s){return s.versions.at(-1)}
function media(s,v,kind,extra=''){return '/media?shot='+encodeURIComponent(s.id)+'&version='+encodeURIComponent(v?.id||'')+'&kind='+kind+extra}
function message(text,error=false){$('message').textContent=text;$('message').classList.toggle('error',error)}
function navigation(){const counts={approved:0,changes:0,pending:0,missing:0};for(const s of data.manifest.shots)counts[decision(s,last(s)).status]++;$('counts').textContent=`已通过 ${counts.approved} · 待确认 ${counts.pending} · 待修改 ${counts.changes} · 待生成 ${counts.missing}`;$('shotList').replaceChildren();for(const s of data.manifest.shots){const status=decision(s,last(s)).status;if($('filter').value!=='all'&&$('filter').value!==status)continue;const b=document.createElement('button');b.className='shot'+(s.id===shot?.id?' active':'');const a=document.createElement('span');a.textContent=s.id;const c=document.createElement('span');c.className='badge '+status;c.textContent=names[status];b.append(a,c);b.onclick=()=>select(s.id);$('shotList').append(b)}}
function canLeave(){return !dirty||confirm('当前意见还没保存。确定切换片段吗？')}
function select(id,vid,force=false){if(busy)return;if(!force&&!canLeave())return;source.pause();output.pause();shot=data.manifest.shots.find(s=>s.id===id)||data.manifest.shots[0];version=shot.versions.find(v=>v.id===vid)||last(shot);dirty=false;localStorage.setItem('ai-op-review-shot',shot.id);history.replaceState(null,'','#shot='+shot.id);const d=decision(shot,version);$('title').textContent='镜头 '+shot.id;$('time').textContent=`${shot.start.toFixed(3)}–${shot.end.toFixed(3)} 秒 · ${shot.frames} 帧`;$('cast').textContent=shot.cast.length?'角色：'+shot.cast.join(' / '):'道具 / 文字';$('status').textContent=names[d.status];$('status').className=d.status;$('version').replaceChildren();for(const v of shot.versions){const o=document.createElement('option');o.value=v.id;o.textContent=v.label+' · '+names[decision(shot,v).status];o.selected=v.id===version?.id;$('version').append(o)}$('version').disabled=!version;source.src=media(shot,null,'source');output.classList.toggle('hidden',!version);$('missing').classList.toggle('hidden',!!version);if(version)output.src=media(shot,version,'output');else{output.removeAttribute('src');output.load()}$('versionNote').textContent=version?'版本 '+version.id.slice(0,15):'原片可先查看';$('promptNote').textContent=version?.prompt.note||'尚未生成，下面“原计划说明”中的文本还没有用于产出此镜头。';$('prompt').textContent=version?.prompt.text||'本版本没有可展示的实际 H3 提示词。';$('copyPrompt').disabled=!version?.prompt.text;$('description').textContent=shot.description;$('credits').textContent=shot.credits.length?'原计划文字任务：'+shot.credits.map(x=>x.join(' → ')).join('；'):'原计划无演职员/角色名字替换项。';$('planned').textContent=shot.planned_prompt;const q=shot.queued;$('queuedBox').classList.toggle('hidden',!q||q.state==='done');$('queued').textContent=q?.prompt||'';$('queuedInfo').textContent=q?('参考图（按 Picture 顺序）：'+(q.cast.length?q.cast.map((c,i)=>'Picture '+(i+1)+' = '+c).join('，'):'无，纯文字编辑')+'；'+q.label+'；任务目录 '+q.dir):'';$('note').value=d.note||'';$('draft').value=d.prompt_draft||'';$('approvedNote').classList.toggle('hidden',d.status!=='approved');$('refs').replaceChildren();for(const r of version?.prompt.refs||[]){const f=document.createElement('figure');const c=document.createElement('figcaption');c.textContent='Picture '+r.index;if(r.path){const img=document.createElement('img');img.src=media(shot,version,'ref','&index='+r.index);img.alt='实际参考图片 '+r.index;f.append(img)}else{f.textContent='参考图片文件缺失'}f.append(c);$('refs').append(f)}$('seed').textContent=version?.prompt.seed!=null?'实际种子：'+version.prompt.seed:'';$('workflow').textContent=version?.prompt.source||'';for(const id of ['approve','changes','pending','usePrompt'])$(id).disabled=!version;message('');navigation();const ix=data.manifest.shots.indexOf(shot);$('prev').disabled=ix===0;$('next').disabled=ix===data.manifest.shots.length-1;rate()}
function rate(){for(const v of [source,output]){v.playbackRate=Number($('speed').value);v.loop=$('loop').checked}}
async function save(status){if(!version||busy)return;busy=true;const body={revision:data.state.revision,shot:shot.id,version:version.id,status,note:$('note').value,prompt_draft:$('draft').value};try{const r=await fetch('/api/decision',{method:'POST',headers:{'Content-Type':'application/json','X-Shot-Review':'1'},body:JSON.stringify(body)});const result=await r.json();if(!r.ok)throw Error(result.error||'保存失败');data.state=result.state;dirty=false;busy=false;const old=shot.id;select(shot.id,version.id,true);message('已保存：'+old+' '+names[status]);if(status==='approved'){const list=data.manifest.shots;const ix=list.indexOf(shot);const next=[...list.slice(ix+1),...list.slice(0,ix)].find(s=>s.versions.length&&decision(s,last(s)).status==='pending');if(next){select(next.id,undefined,true);message('镜头 '+old+' 已通过并保存。现在查看 '+next.id+'。')}}}catch(e){message(e.message,true)}finally{busy=false}}
async function copy(text){try{await navigator.clipboard.writeText(text);message('已复制。')}catch(e){message('复制失败，可直接选择文本复制。',true)}}
$('filter').onchange=navigation;$('version').onchange=()=>select(shot.id,$('version').value);$('prev').onclick=()=>select(data.manifest.shots[data.manifest.shots.indexOf(shot)-1].id);$('next').onclick=()=>select(data.manifest.shots[data.manifest.shots.indexOf(shot)+1].id);
$('play').onclick=async()=>{for(const v of [source,output]){if(v.getAttribute('src')){v.currentTime=0;v.play().catch(e=>message(e.message,true))}}};$('pause').onclick=()=>{source.pause();output.pause()};for(const [id,step] of [['backFrame',-1],['forwardFrame',1]])$(id).onclick=()=>{for(const v of [source,output]){v.pause();if(Number.isFinite(v.duration))v.currentTime=Math.max(0,Math.min(v.duration-.0001,v.currentTime+step*1001/24000))}};$('speed').onchange=rate;$('loop').onchange=rate;for(const v of [source,output])v.onloadedmetadata=rate;
$('note').oninput=$('draft').oninput=()=>{dirty=true};$('usePrompt').onclick=()=>{if($('draft').value&&!confirm('用实际提示词替换当前草案？'))return;$('draft').value=version?.prompt.text||'';dirty=true};$('approve').onclick=()=>save('approved');$('changes').onclick=()=>save('changes');$('pending').onclick=()=>save('pending');$('copyPrompt').onclick=()=>copy(version?.prompt.text||'');$('copyFeedback').onclick=()=>copy(`请处理校园 AI OP 镜头 ${shot.id}，当前版本 ${version?.id||'尚未生成'}。\n问题：${$('note').value}\n${$('draft').value?'提示词草案：\n'+$('draft').value:''}\n请先读取逐镜验收记录，与本版本实际提示词对照后迭代。`);window.onbeforeunload=e=>{if(dirty){e.preventDefault();e.returnValue=''}};
fetch('/api/review').then(r=>r.json()).then(r=>{data=r;const id=new URLSearchParams(location.hash.slice(1)).get('shot')||localStorage.getItem('ai-op-review-shot')||'001';select(id,undefined,true)}).catch(e=>{$('title').textContent='无法读取验收记录';message(e.message,true)});
</script></body></html>
